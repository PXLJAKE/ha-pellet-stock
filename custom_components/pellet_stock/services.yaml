add_delivery:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: pellet_stock
    kg:
      required: true
      example: 3000
      selector:
        number:
          min: 0.1
          max: 100000
          step: 0.1
          unit_of_measurement: kg
          mode: box
    price:
      example: 1250
      selector:
        number:
          min: 0
          max: 100000
          step: 0.01
          mode: box
    date:
      selector:
        date:
    note:
      selector:
        text:

correct_stock:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: pellet_stock
    stock_kg:
      required: true
      example: 2500
      selector:
        number:
          min: 0
          max: 100000
          step: 1
          unit_of_measurement: kg
          mode: box

delete_delivery:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: pellet_stock
    delivery_id:
      required: true
      selector:
        text:

import_history:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: pellet_stock
    replace:
      required: false
      default: false
      selector:
        boolean:
